name: "Test: E2E (Playwright)"
on:
  workflow_call:
    inputs:
      version:
        description: "Version of the stack to test"
        required: true
        type: string
jobs:
  playwright:
    runs-on: ubuntu-24.04
    name: "Playwright (${{ matrix.shard }}/${{ strategy.job-total }})"
    strategy:
      fail-fast: false
      matrix:
        # Each shard pays about a minute of fixed setup (stack start, browser
        # install) to run well under a minute of tests. Add shards only when
        # the test step grows past that overhead.
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: playwright/yarn.lock
      - uses: ./.github/actions/start-stack
        with:
          version: ${{ inputs.version }}
      - name: Rebuild Lighthouse schema cache for testing env
        # The start-stack action boots the fpm image with APP_ENV=testing,
        # but any pre-existing schema cache from the image build (or from
        # a prior container start in a different env) would freeze the
        # @show(env: ["local", "testing"]) decisions made at cache-write
        # time. Force a rebuild here so the test-isolation mutations
        # (resetDatabase / setupTestToken / teardownTestToken /
        # seedSubmission) are definitely in the schema before Playwright
        # starts hitting /graphql.
        run: |
          docker compose exec -T phpfpm php artisan lighthouse:clear-cache
          docker compose exec -T phpfpm php artisan lighthouse:cache
      - name: Install dependencies
        run: cd playwright && yarn install --frozen-lockfile
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('playwright/yarn.lock') }}
      - name: Install Playwright browsers
        if: ${{ steps.browser-cache.outputs.cache-hit != 'true' }}
        run: cd playwright && npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: ${{ steps.browser-cache.outputs.cache-hit == 'true' }}
        run: cd playwright && npx playwright install-deps chromium
      - name: Run Playwright tests
        run: cd playwright && npx playwright test --project=chromium --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8888
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: playwright/blob-report/
          retention-days: 1
      - name: Upload copywriting screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: playwright/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            playwright/test-results/
            playwright/playwright-report/
          retention-days: 14
      - run: docker compose down

  merge-reports:
    if: ${{ !cancelled() }}
    needs: [playwright]
    runs-on: ubuntu-24.04
    name: "Merge Playwright Reports"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: playwright/yarn.lock
      - name: Install dependencies
        run: cd playwright && yarn install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: playwright/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge reports
        run: cd playwright && npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright/playwright-report/
          retention-days: 14
